<body>



<script>
  var fingerprintPrefix = 'jingWebFingerprint';
  var userAgent = navigator.userAgent;
  var isIosOrSafari = /\(i[^;]+;( U;)? CPU.+Mac OS X/.test(userAgent) || (/Safari/.test(userAgent) && !/Chrome/.test(userAgent));

  var createUuid = function () {
    var s = [];
    var hexDigits = '0123456789abcdef';
    for (var i = 0; i < 36; i++) {
      s[i] = hexDigits.substr(Math.floor(Math.random() * 0x10), 1);
    }
    s[14] = '4';
    s[19] = hexDigits.substr((s[19] & 0x3) | 0x8, 1);
    s[8] = s[13] = s[18] = s[23] = '-';
    return s.join('');
  };
  var postMessageToParent = function (action, visitorId) {
    if (window.parent) {
      window.parent.postMessage({
        action: action,
        visitorId: visitorId
      }, '*');
    }
  };
  var sendVisitorId = function () {
    try {
      var visitorId = localStorage.getItem('jingVisitorUserId');
      if (!visitorId) {
        visitorId = ("" + fingerprintPrefix + createUuid());
        localStorage.setItem('jingVisitorUserId', visitorId);
      }
      postMessageToParent(isIosOrSafari ? 'cannotUseLocalStorage' : 'postVisitorId', visitorId);
    } catch (err) {
      postMessageToParent('cannotUseLocalStorage', ("" + fingerprintPrefix + createUuid()));
    }
  };
  window.addEventListener('message', function (event) {
    var data = event.data;
    if (data.action === 'getVisitorId') {
      sendVisitorId();
    }
  });
  sendVisitorId();
</script>


</body></html>
